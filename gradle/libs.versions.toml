# Каталог версий зависимостей.
# Версии собраны здесь, а не разбросаны по build.gradle.kts, — так их видно
# в одном месте и проще обновлять.

[versions]
resilience4j = "2.4.0"
bucket4j = "8.10.1"
spring-cloud-context = "4.2.4"

[libraries]
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
bucket4j-core = { module = "com.bucket4j:bucket4j-core", version.ref = "bucket4j" }
spring-cloud-context = { module = "org.springframework.cloud:spring-cloud-context", version.ref = "spring-cloud-context" }
