# =============================================================================
# CI/CD Pipeline: сборка, тесты, автодеплой на сервер
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main, 'feature/**']  # автодеплой при push в main или feature-ветки
  workflow_dispatch:  # ручной деплой из любой ветки (кнопка "Run workflow")
  pull_request:
    branches: [main]

# Минимальные permissions (read-only по умолчанию)
permissions:
  contents: read

# Concurrency: отменяем предыдущий запуск для того же ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # CI: сборка и тесты
  # =========================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # =========================================================================
  # Deploy: автодеплой на сервер
  # - push в main или feature-ветки → автоматически
  # - workflow_dispatch → вручную из любой ветки
  # =========================================================================
  deploy:
    name: Deploy to Server
    # Деплой при push в main/feature ИЛИ при ручном запуске (не PR)
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))) || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/pii-security-module || exit 1
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
            echo "Deploy completed from branch: ${{ github.ref_name }}"