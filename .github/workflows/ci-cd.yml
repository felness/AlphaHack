# =============================================================================
# CI/CD Pipeline: сборка, тесты, публикация образа, автодеплой на сервер
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main, 'feature/**']  # автодеплой при push в main или feature-ветки
  workflow_dispatch:  # ручной деплой из любой ветки

# Минимальные permissions (read-only по умолчанию)
permissions:
  contents: read

# Concurrency: отменяем предыдущий запуск для того же ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # CI: сборка и тесты
  # =========================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # =========================================================================
  # Build: собрать Docker-образ и запушить в GitHub Container Registry
  # =========================================================================
  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # для публикации в ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/alphahack:latest
            ghcr.io/${{ github.repository_owner }}/alphahack:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy: автодеплой на сервер (контейнер из ghcr.io)
  # - push в main или feature-ветки → автоматически
  # - workflow_dispatch → вручную
  # =========================================================================
  deploy:
    name: Deploy to Server
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))) || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker network create pii-net 2>/dev/null || true
            docker pull redis:7-alpine
            docker stop pii-redis 2>/dev/null || true
            docker rm pii-redis 2>/dev/null || true
            docker run -d --name pii-redis --restart unless-stopped --network pii-net redis:7-alpine
            docker pull ghcr.io/${{ github.repository_owner }}/alphahack:latest
            docker stop pii-module 2>/dev/null || true
            docker rm pii-module 2>/dev/null || true
            docker run -d --name pii-module --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_DATA_REDIS_HOST=pii-redis \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e PII_STORE_TYPE=redis \
              -e SERVER_PORT=8080 \
              --network pii-net \
              ghcr.io/${{ github.repository_owner }}/alphahack:latest
            sleep 10
            curl -sf http://localhost:8080/actuator/health && echo "DEPLOY OK" || echo "DEPLOY FAILED"