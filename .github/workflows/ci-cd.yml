# =============================================================================
# CI/CD Pipeline: сборка, тесты, автодеплой на сервер
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Минимальные permissions (read-only по умолчанию)
permissions:
  contents: read

# Concurrency: отменяем предыдущий запуск для того же ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # CI: сборка и тесты
  # =========================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf2254870afd81565b4e4111673d9e8321c3e # v4.3.0

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # =========================================================================
  # Deploy: автодеплой на сервер (только push в main, не PR)
  # =========================================================================
  deploy:
    name: Deploy to Server
    # Untrusted PR guardrail: деплой только из доверенного репозитория
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/pii-security-module || exit 1
            git pull origin main
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
            echo "Deploy completed"