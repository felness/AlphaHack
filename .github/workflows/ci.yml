name: Build and Deploy

on:
  push:
    branches: [main, feature/develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/alphahack:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alphahack:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker network create pii-net 2>/dev/null || true
            docker pull redis:7-alpine
            docker stop pii-redis 2>/dev/null || true
            docker rm pii-redis 2>/dev/null || true
            docker run -d --name pii-redis --restart unless-stopped --network pii-net redis:7-alpine
            docker pull ghcr.io/${{ github.repository_owner }}/alphahack:latest
            docker stop pii-module 2>/dev/null || true
            docker rm pii-module 2>/dev/null || true
            docker run -d --name pii-module --restart unless-stopped \
              -p 8000:8000 \
              -e HOST=0.0.0.0 \
              -e PORT=8000 \
              -e WORKERS=4 \
              -e REDIS_HOST=pii-redis \
              -e REDIS_PORT=6379 \
              -e ALLOWED_SYSTEMS=default,test,prod \
              -e ALLOW_ANONYMOUS=true \
              -e RATE_LIMIT_RPS=1000 \
              -e MAX_PAYLOAD_CHARS=1000000 \
              --network pii-net \
              ghcr.io/${{ github.repository_owner }}/alphahack:latest
            sleep 5
            curl -sf http://localhost:8000/health && echo "DEPLOY OK" || echo "DEPLOY FAILED"